{% load static %}
<!-- Global AI chat widget -->
<link rel="stylesheet" href="{% static 'css/chat_widget.css' %}">
<div class="ai-chat-widget" id="ai-chat-widget">
    <button class="ai-chat-fab" id="ai-chat-fab" type="button" aria-label="Open AI assistant">💬</button>
    <div class="ai-chat-panel" id="ai-chat-panel" role="dialog" aria-label="AI assistant chat">
        <div class="ai-chat-header">
            <span>AI Shopping Assistant</span>
            <button id="ai-chat-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="ai-chat-messages" id="ai-chat-messages"></div>
        <form class="ai-chat-form" id="ai-chat-form">
            {% csrf_token %}
            <input type="text" id="ai-chat-input" placeholder="Ask me anything..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>
</div>
<script src="{% static 'js/chat_widget.js' %}" defer></script>
