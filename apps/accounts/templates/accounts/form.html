{% extends 'base_store.html' %}

{% block title %}{{ title }} — AI E-Commerce{% endblock %}

{% block store_content %}
<section class="section">
    <h1 class="section__title">{{ title }}</h1>
    <form method="post" class="card" style="max-width: 500px;">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_label">Label</label>
            {{ form.label }}
        </div>
        <div class="form-group">
            <label for="id_street">Street Address</label>
            {{ form.street }}
        </div>
        <div class="form-group">
            <label for="id_city">City</label>
            {{ form.city }}
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
            <div class="form-group">
                <label for="id_state">State</label>
                {{ form.state }}
            </div>
            <div class="form-group">
                <label for="id_postal_code">Postal Code</label>
                {{ form.postal_code }}
            </div>
        </div>
        <div class="form-group">
            <label for="id_country">Country</label>
            {{ form.country }}
        </div>
        <div class="form-group">
            <label style="display: flex; align-items: center; gap: var(--space-sm); cursor: pointer;">
                {{ form.is_default }}
                <span>Set as default address</span>
            </label>
        </div>
        <div style="display: flex; gap: var(--space-md);">
            <button type="submit" class="btn btn--primary">Save Address</button>
            <a href="{% url 'accounts:address_list' %}" class="btn btn--outline">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
